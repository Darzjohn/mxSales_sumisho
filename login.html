<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e4c9a">
  <title>Sumisho Motors · Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="assessts/sumisho-logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <img class="login-logo" src="assessts/sumisho-logo.png" alt="Sumisho Motor Finance Corporation">
    <h1 class="sr-only">Sumisho Motors</h1>
    <p class="muted">Secure Pricing Portal</p>
 
    <form id="loginForm" novalidate>
      <label for="username"><i class="fas fa-user"></i> Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Enter username" autofocus>
 
      <label for="password"><i class="fas fa-lock"></i> Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
        <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
      </div>
 
      <p id="loginError" class="login-error" role="alert"></p>
      <button type="submit" class="btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> Access Dashboard</button>
    </form>
    <p class="muted small center"><i class="fas fa-motorcycle"></i> Authorized personnel only</p>
  </main>
 
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.replace('index.html');
 
    const form = document.getElementById('loginForm');
    const u = document.getElementById('username');
    const p = document.getElementById('password');
    const err = document.getElementById('loginError');
 
    document.getElementById('togglePw').addEventListener('click', function () {
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      this.firstElementChild.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
 
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      u.classList.remove('invalid'); p.classList.remove('invalid');
      if (Auth.login(u.value.trim(), p.value)) {
        location.replace('index.html');
      } else {
        err.textContent = 'Invalid username or password.';
        u.classList.add('invalid'); p.classList.add('invalid');
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        p.value = ''; p.focus();
      }
    });
  </script>
</body>
</html>
